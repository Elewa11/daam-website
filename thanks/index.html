<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>تم الإرسال بنجاح | مؤسسة دعم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/v2/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <meta name="theme-color" content="#0f172a">
    <style>
        .thx { min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 50px 20px; }
        .thx .ico { width: 92px; height: 92px; border-radius: 50%; background: var(--primary-light); color: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; margin: 0 auto 24px; }
        .thx h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); margin-bottom: 10px; }
        .thx p { color: var(--body); font-size: 1.1rem; max-width: 560px; margin: 0 auto 8px; }
        .thx .en { color: var(--muted); direction: ltr; margin-bottom: 30px; }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container nav">
            <a href="/" class="nav-logo"><img src="/assets/images/logo_header.png" alt="مؤسسة دعم" class="logo-light"><img src="/assets/images/logo_header_new.png" alt="مؤسسة دعم" class="logo-dark"></a>
        </div>
    </header>

    <main class="thx">
        <div class="container">
            <div class="ico"><i class="fas fa-circle-check"></i></div>
            <h1>تم إرسال رسالتك بنجاح</h1>
            <p>شكراً لتواصلك مع مؤسسة دعم للتنمية المستدامة — وصلتنا بياناتك وسيتواصل معك فريقنا في أقرب وقت.</p>
            <p class="en">Your message has been received. Thank you for contacting Da’am Foundation.</p>
            <a href="/" class="btn btn-accent btn-lg">العودة للرئيسية</a>
        </div>
    </main>

    <script>document.querySelector('.site-header').classList.add('scrolled');</script>
</body>

</html>
