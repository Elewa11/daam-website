<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>لوحة تحكم مؤسسة دعم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
</head>

<body>

    <!-- LOGIN -->
    <div id="login" class="login-screen">
        <div class="login-card">
            <img src="../../assets/images/logo_header.png" alt="مؤسسة دعم" class="logo" style="filter:brightness(0) invert(0)">
            <h1>لوحة تحكم الموقع</h1>
            <p class="sub">إدارة الأخبار وفريق العمل</p>
            <div class="field-group">
                <label for="pwd">كلمة المرور</label>
                <input type="password" id="pwd" placeholder="أدخل كلمة المرور" autocomplete="current-password">
            </div>
            <button class="btn full" id="loginBtn">تسجيل الدخول</button>
            <p class="err" id="loginErr">كلمة المرور غير صحيحة.</p>
        </div>
    </div>

    <!-- APP -->
    <div id="app" class="hidden">
        <div class="topbar">
            <div class="brand">
                <img src="../../assets/images/logo_header.png" alt="مؤسسة دعم">
                <b>لوحة التحكم</b>
            </div>
            <div class="actions">
                <a class="link" href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> عرض الموقع</a>
                <button class="btn ghost sm" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>

        <div class="wrap">
            <div class="tabs">
                <button class="tab active" data-tab="news">📰 الأخبار</button>
                <button class="tab" data-tab="team">👥 فريق العمل</button>
            </div>

            <!-- NEWS VIEW -->
            <div id="view-news">
                <div class="view-head">
                    <h2>الأخبار والبوستات</h2>
                    <button class="btn accent" id="newPostBtn"><i class="fas fa-plus"></i> خبر جديد</button>
                </div>
                <div class="news-list" id="newsList"></div>
            </div>

            <!-- TEAM VIEW -->
            <div id="view-team" class="hidden">
                <div class="view-head">
                    <h2>فريق العمل (القائمون على المؤسسة)</h2>
                    <button class="btn accent" id="addMemberBtn"><i class="fas fa-plus"></i> عضو جديد</button>
                </div>
                <div class="team-list" id="teamList"></div>
                <div style="margin-top:20px"><button class="btn" id="saveTeamBtn"><i class="fas fa-cloud-arrow-up"></i> حفظ الفريق ونشره</button></div>
            </div>
        </div>
    </div>

    <!-- POST EDITOR MODAL -->
    <div class="modal" id="postModal">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="modalTitle">خبر جديد</h3>
                <button class="x" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Cover -->
                <div class="field-group">
                    <label>صورة الخبر الرئيسية</label>
                    <div class="cover-pick" id="coverPick">
                        <div class="ph" id="coverPh"><i class="fas fa-image fa-2x"></i><br>اضغط لاختيار صورة</div>
                        <img id="coverImg" style="display:none">
                    </div>
                    <input type="file" id="coverInput" accept="image/*" class="hidden">
                </div>

                <div class="grid2">
                    <div class="field-group"><label>الوسم (عربي)</label><input id="f_tag_ar" placeholder="خبر / إعلان / نشاط"></div>
                    <div class="field-group"><label>الوسم (إنجليزي)</label><input id="f_tag_en" placeholder="News / Announcement"></div>
                </div>
                <div class="field-group"><label>التاريخ</label><input id="f_date" placeholder="مثال: 2025 أو 12 يونيو 2025"></div>

                <div class="grid2">
                    <div class="field-group"><label>العنوان (عربي)</label><input id="f_title_ar" placeholder="عنوان الخبر بالعربية"></div>
                    <div class="field-group"><label>العنوان (إنجليزي)</label><input id="f_title_en" placeholder="Title in English" dir="ltr"></div>
                </div>
                <div class="grid2">
                    <div class="field-group"><label>مقتطف قصير (عربي)</label><textarea id="f_excerpt_ar" rows="2" placeholder="ملخص قصير يظهر في البطاقة"></textarea></div>
                    <div class="field-group"><label>مقتطف قصير (إنجليزي)</label><textarea id="f_excerpt_en" rows="2" dir="ltr" placeholder="Short summary"></textarea></div>
                </div>

                <div class="field-group">
                    <label>محتوى الخبر (عربي)</label>
                    <div class="rt-wrap" data-dir="rtl"><div class="rt-toolbar"></div><div class="rt-area" id="body_ar" contenteditable="true" dir="rtl"></div></div>
                </div>
                <div class="field-group">
                    <label>محتوى الخبر (إنجليزي)</label>
                    <div class="rt-wrap" data-dir="ltr"><div class="rt-toolbar"></div><div class="rt-area" id="body_en" contenteditable="true" dir="ltr"></div></div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn ghost" id="cancelPost">إلغاء</button>
                <button class="btn accent" id="savePost"><i class="fas fa-cloud-arrow-up"></i> حفظ ونشر</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="loading" id="loading"><div class="spinner"></div><p id="loadingText" class="muted">جارٍ الحفظ...</p></div>

    <script src="admin.js"></script>
</body>

</html>
